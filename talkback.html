<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#101418">
<title>Talkback</title>
<style>
/* Layout: one screen, split face-to-face. Top half belongs to the other person (rotated to face them), bottom half is yours, control strip between. */
:root{
  --bg:#f3f5f7; --panel:#ffffff; --fg:#12161b; --muted:#5d6874; --line:#d9dee4;
  --mine:#1f6feb; --theirs:#c2410c; --hold:#0f9d58; --warn:#b42318;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0d1014; --panel:#161b21; --fg:#eef1f4; --muted:#93a0ad; --line:#2a323b;
  --mine:#4c8dff; --theirs:#f0834a; --hold:#22c47a; --warn:#ff6b5e; color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg);color:var(--fg);font-family:var(--font);
  display:grid;grid-template-rows:1fr auto 1fr;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none;
}
.panel{
  --side:var(--mine);
  display:grid;grid-template-rows:auto 1fr auto;gap:12px;min-height:0;
  padding:14px max(16px,env(safe-area-inset-left,0px)) 14px max(16px,env(safe-area-inset-right,0px));
  background:var(--panel);
}
.panel.theirs{--side:var(--theirs)}
body.facing .panel.theirs{transform:rotate(180deg)}
.head{display:flex;align-items:center;gap:10px}
.who{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--side);font-weight:700}
select{
  margin-left:auto;font:inherit;font-size:15px;color:var(--fg);background:var(--bg);
  border:1px solid var(--line);border-radius:8px;padding:6px 8px;max-width:60%;
}
.out{min-height:0;overflow-y:auto;display:flex;flex-direction:column;justify-content:flex-end;gap:6px}
.label{font-size:12px;color:var(--muted)}
.text{font-size:clamp(20px,5.5vw,30px);line-height:1.3;font-weight:600;overflow-wrap:anywhere}
.text.live{color:var(--muted);font-weight:500}
.text.err{color:var(--warn);font-size:16px;font-weight:500}
.row{display:flex;gap:10px;align-items:stretch}
.hold{
  flex:1;min-height:76px;border:0;border-radius:16px;font:inherit;font-size:18px;font-weight:700;
  color:#fff;background:var(--side);touch-action:none;user-select:none;-webkit-user-select:none;
  -webkit-touch-callout:none;transition:transform .08s,background .15s;
}
.hold.on{background:var(--hold);transform:scale(.97)}
.hold:disabled{opacity:.5}
.replay{
  width:76px;border:1px solid var(--line);border-radius:16px;background:var(--bg);color:var(--fg);
  font:inherit;font-size:14px;font-weight:600;
}
.replay:disabled{opacity:.4}
.strip{
  display:flex;flex-wrap:wrap;align-items:center;gap:8px;justify-content:center;
  padding:8px max(16px,env(safe-area-inset-left,0px)) 8px max(16px,env(safe-area-inset-right,0px));
  border-block:1px solid var(--line);font-size:14px;
}
.strip button,.strip label{
  font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);
  border-radius:999px;padding:6px 12px;display:inline-flex;align-items:center;gap:6px;
}
.strip input{accent-color:var(--mine);margin:0}
.strip select{margin:0;max-width:none;border-radius:999px;padding:5px 8px;font-size:14px}
.notice{width:100%;text-align:center;color:var(--warn);font-size:13px}
button:focus-visible,select:focus-visible{outline:2px solid var(--mine);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.hold{transition:none}}
</style>
</head>
<body>

<section class="panel theirs" id="p-theirs">
  <div class="head">
    <span class="who">Them</span>
    <select id="lang-theirs" aria-label="Their language"></select>
  </div>
  <div class="out" id="out-theirs"><span class="label">Hold the button and speak</span></div>
  <div class="row">
    <button class="replay" id="replay-theirs" disabled>Replay</button>
    <button class="hold" id="hold-theirs">Hold to talk</button>
  </div>
</section>

<nav class="strip">
  <button id="flip" type="button">Flip top</button>
  <label><input type="checkbox" id="autospeak" checked> Auto-speak</label>
  <select id="rate" aria-label="Speech speed">
    <option value="0.8">Slow</option>
    <option value="1" selected>Normal</option>
    <option value="1.2">Fast</option>
  </select>
  <div class="notice" id="notice" hidden></div>
</nav>

<section class="panel mine" id="p-mine">
  <div class="head">
    <span class="who">You</span>
    <select id="lang-mine" aria-label="Your language"></select>
  </div>
  <div class="out" id="out-mine"><span class="label">Hold the button and speak. Release when you're done.</span></div>
  <div class="row">
    <button class="replay" id="replay-mine" disabled>Replay</button>
    <button class="hold" id="hold-mine">Hold to talk</button>
  </div>
</section>

<script>
// sr = speech recognition locale, tr = Google Translate code, tts = speech voice locale
const LANGS = [
  ["English (US)","en-US","en","en-US"],["English (UK)","en-GB","en","en-GB"],
  ["Spanish (Spain)","es-ES","es","es-ES"],["Spanish (Mexico)","es-MX","es","es-MX"],
  ["French","fr-FR","fr","fr-FR"],["German","de-DE","de","de-DE"],["Italian","it-IT","it","it-IT"],
  ["Portuguese (Brazil)","pt-BR","pt","pt-BR"],["Japanese","ja-JP","ja","ja-JP"],["Korean","ko-KR","ko","ko-KR"],
  ["Chinese (Mandarin)","zh-CN","zh-CN","zh-CN"],["Chinese (Taiwan)","zh-TW","zh-TW","zh-TW"],
  ["Cantonese","yue-Hant-HK","yue","zh-HK"],["Vietnamese","vi-VN","vi","vi-VN"],
  ["Filipino","fil-PH","tl","fil-PH"],["Thai","th-TH","th","th-TH"],["Indonesian","id-ID","id","id-ID"],
  ["Hindi","hi-IN","hi","hi-IN"],["Punjabi","pa-IN","pa","pa-IN"],["Tamil","ta-IN","ta","ta-IN"],
  ["Arabic","ar-SA","ar","ar-SA"],["Persian","fa-IR","fa","fa-IR"],["Turkish","tr-TR","tr","tr-TR"],
  ["Russian","ru-RU","ru","ru-RU"],["Ukrainian","uk-UA","uk","uk-UA"],["Polish","pl-PL","pl","pl-PL"],
  ["Dutch","nl-NL","nl","nl-NL"],["Greek","el-GR","el","el-GR"],["Hebrew","he-IL","iw","he-IL"]
].map(([name,sr,tr,tts])=>({name,sr,tr,tts}));

const $ = id => document.getElementById(id);
const store = {
  get(k,d){try{const v=localStorage.getItem("talkback."+k);return v===null?d:v}catch{return d}},
  set(k,v){try{localStorage.setItem("talkback."+k,v)}catch{}}
};

const sides = {
  mine:  {other:"theirs", select:$("lang-mine"),   out:$("out-mine"),   hold:$("hold-mine"),   replay:$("replay-mine"),   last:null},
  theirs:{other:"mine",   select:$("lang-theirs"), out:$("out-theirs"), hold:$("hold-theirs"), replay:$("replay-theirs"), last:null}
};
const lang = s => LANGS[sides[s].select.selectedIndex];

for (const s of ["mine","theirs"]) {
  const sel = sides[s].select;
  LANGS.forEach(l => sel.add(new Option(l.name, l.sr)));
  sel.value = store.get("lang."+s, s==="mine" ? "en-US" : "zh-CN");
  if (sel.selectedIndex < 0) sel.selectedIndex = 0;
  sel.onchange = () => store.set("lang."+s, sel.value);
}

// ---------- settings ----------
const autospeak = $("autospeak"), rate = $("rate");
autospeak.checked = store.get("autospeak","1") === "1";
autospeak.onchange = () => store.set("autospeak", autospeak.checked ? "1" : "0");
rate.value = store.get("rate","1");
rate.onchange = () => store.set("rate", rate.value);
if (store.get("facing","0") === "1") document.body.classList.add("facing");
$("flip").onclick = () => {
  document.body.classList.toggle("facing");
  store.set("facing", document.body.classList.contains("facing") ? "1" : "0");
};

function notice(msg){ const n=$("notice"); n.textContent=msg||""; n.hidden=!msg; }

// ---------- rendering ----------
function show(side, {label, text, cls=""}) {
  const out = sides[side].out;
  out.replaceChildren();
  if (label) { const l=document.createElement("span"); l.className="label"; l.textContent=label; out.append(l); }
  if (text)  { const t=document.createElement("div");  t.className="text "+cls; t.textContent=text; out.append(t); }
  out.scrollTop = out.scrollHeight;
}

// ---------- speech output ----------
let voices = [];
function loadVoices(){ try{ voices = speechSynthesis.getVoices() || []; }catch{ voices = []; } }
if ("speechSynthesis" in window) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }

function pickVoice(tts){
  const norm = v => v.lang.replace("_","-").toLowerCase();
  const want = tts.toLowerCase(), base = want.split("-")[0];
  return voices.find(v => norm(v) === want) || voices.find(v => norm(v).startsWith(base+"-")) || voices.find(v => norm(v) === base) || null;
}
function speak(text, tts){
  if (!("speechSynthesis" in window) || !text) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = tts; u.rate = parseFloat(rate.value) || 1;
  const v = pickVoice(tts); if (v) u.voice = v;
  speechSynthesis.speak(u);
}
let primed = false;
function primeSpeech(){ // first speak must follow a tap on some browsers
  if (primed || !("speechSynthesis" in window)) return;
  primed = true;
  try { const u = new SpeechSynthesisUtterance(" "); u.volume = 0; speechSynthesis.speak(u); } catch {}
}

// ---------- translation ----------
async function translate(text, from, to){
  if (from === to) return text;
  const url = "https://translate.googleapis.com/translate_a/single?client=gtx&dt=t"
    + "&sl=" + encodeURIComponent(from) + "&tl=" + encodeURIComponent(to) + "&q=" + encodeURIComponent(text);
  const res = await fetch(url);
  if (!res.ok) throw new Error("HTTP " + res.status);
  const data = await res.json();
  return (data[0] || []).map(seg => seg[0] || "").join("").trim();
}

// ---------- hold-to-talk recognition ----------
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (!SR) {
  notice("This browser has no speech recognition. Open this file in Chrome.");
  for (const s of ["mine","theirs"]) sides[s].hold.disabled = true;
}

let active = null; // {side, rec, committed, session, released, done, fallback}

function sessionText(e){
  let t = "";
  for (let i = 0; i < e.results.length; i++) t += e.results[i][0].transcript;
  return t.trim();
}

function startRec(st){
  const rec = new SR();
  rec.lang = lang(st.side).sr;
  rec.continuous = false;      // Android Chrome duplicates text in continuous mode; we restart instead
  rec.interimResults = true;
  rec.maxAlternatives = 1;
  st.session = "";
  rec.onresult = e => {
    st.session = sessionText(e);
    const so_far = [st.committed, st.session].filter(Boolean).join(" ");
    show(st.side, {label:"Listening…", text:so_far, cls:"live"});
  };
  rec.onerror = e => {
    if (e.error === "not-allowed" || e.error === "service-not-allowed") {
      st.blocked = true;
      const local = location.protocol === "file:" || location.protocol === "content:";
      notice(local
        ? "Microphone is blocked for files opened from storage. Host this file (for example Netlify Drop) and open the https link."
        : "Microphone access is blocked. Allow it in Chrome's site settings and try again.");
    } else if (e.error === "network") {
      st.netErr = true;
    }
    // no-speech / aborted: ignore, onend handles restart or finish
  };
  rec.onend = () => {
    if (st.session) st.committed = [st.committed, st.session].filter(Boolean).join(" ");
    st.session = "";
    if (!st.released && !st.blocked && active === st) {
      try { startRec(st); } catch { finish(st); }  // still holding: keep listening through pauses
    } else {
      finish(st);
    }
  };
  st.rec = rec;
  rec.start();
}

function beginHold(side, ev){
  if (!SR || active) return;
  ev.preventDefault();
  try { ev.currentTarget.setPointerCapture(ev.pointerId); } catch {}
  primeSpeech();
  try { speechSynthesis.cancel(); } catch {}
  notice("");
  const st = {side, committed:"", session:"", released:false, done:false};
  active = st;
  sides[side].hold.classList.add("on");
  sides[side].hold.textContent = "Listening — release to send";
  sides[sides[side].other].hold.disabled = true;
  show(side, {label:"Listening…"});
  try { startRec(st); } catch { finish(st); }
}

function endHold(side){
  const st = active;
  if (!st || st.side !== side || st.released) return;
  st.released = true;
  sides[side].hold.classList.remove("on");
  sides[side].hold.textContent = "Translating…";
  try { st.rec && st.rec.stop(); } catch {}
  st.fallback = setTimeout(() => finish(st), 2500); // in case onend never fires
}

async function finish(st){
  if (st.done) return;
  st.done = true;
  clearTimeout(st.fallback);
  if (st.session) st.committed = [st.committed, st.session].filter(Boolean).join(" ");
  const side = st.side, other = sides[side].other;
  const resetButtons = () => {
    sides[side].hold.classList.remove("on");
    sides[side].hold.textContent = "Hold to talk";
    sides[other].hold.disabled = false;
    if (active === st) active = null;
  };
  const said = st.committed.trim();
  if (!said) {
    show(side, {label: st.netErr ? "Speech service unreachable" : "Didn't catch anything", text: st.netErr ? "Check your connection and try again." : "", cls:"err"});
    resetButtons();
    return;
  }
  const from = lang(side), to = lang(other);
  show(side, {label:"You said", text:said});
  show(other, {label:"Translating…"});
  try {
    const out = await translate(said, from.tr, to.tr);
    sides[side].last  = {text:said, tts:from.tts};
    sides[other].last = {text:out,  tts:to.tts};
    show(side,  {label:"Said", text:said});
    show(other, {label:"Translated", text:out});
    sides[side].replay.disabled = false;
    sides[other].replay.disabled = false;
    if (autospeak.checked) speak(out, to.tts);
  } catch (err) {
    show(other, {label:"Couldn't translate", text:"The translation service didn't respond. Check your connection and try again.", cls:"err"});
  }
  resetButtons();
}

for (const s of ["mine","theirs"]) {
  const b = sides[s].hold;
  b.addEventListener("pointerdown", e => beginHold(s, e));
  b.addEventListener("pointerup", () => endHold(s));
  b.addEventListener("pointercancel", () => endHold(s));
  b.addEventListener("lostpointercapture", () => endHold(s));
  b.addEventListener("contextmenu", e => e.preventDefault());
  sides[s].replay.onclick = () => { const l = sides[s].last; if (l) { primeSpeech(); speak(l.text, l.tts); } };
}
// keep the screen awake during a conversation where supported
try { navigator.wakeLock && navigator.wakeLock.request("screen").catch(()=>{}); } catch {}
</script>
</body>
</html>
